# Scaffolded by tools/art/theme-scaffold.mjs from a verified roster manifest
# named `cats-v2`, then SHIPPED AS `cats` — see the retirement note at the foot
# of this header. The flow directories under art/discovery/ keep their `cats-v2`
# names: they are spend-bound records of how these twelve were screened, and
# renaming them would falsify the digests that prove it.
#
# `persona` is the concept's stance, and it is FLAVOUR TEXT: printed by
  # `familiar theme preview`, read by no prompt. Do not move it into a look.
#
# Fill the art with:
#   node tools/art/compile.mjs <sheet.png> --member <id> --theme themes/cats
#
# EDITED SINCE SCAFFOLDING, twice, and both edits are corrections rather than taste:
#
#   THE POSE STRINGS WERE REWRITTEN FROM THE PROMPTS THAT ACTUALLY DREW THE ART.
#   The scaffolder fills every member's `poses` from the roster's declared pose
#   set, which is right for a roster and wrong for these twelve: ten of them had
#   `needs-input` and `needs-approval` REPLACED at render time (a high-camera
#   looking-up pose and a front-on reaching paw), and meerkat and persian diverge
#   on all six because their frozen `look` carries a posture the quadruped
#   vocabulary does not fit. Thirty-two strings described art nobody drew. Each is
#   now copied from that member's own sprites/<id>/provenance.json, so a future
#   re-render reads the text that produced what is on disk.
#
#   `Odd Eyed White` -> `Odd-Eyed White` and `Seal Point` -> `Seal-Point`, the
#   lossy title-casing the header above warns about.
#
# THE PREVIOUS `cats` WAS RETIRED TO MAKE ROOM FOR THIS ONE, and the label
# collision this header used to flag as open is what that decision closed. The
# eleven earlier cats plus the static-v1 ginger tabby are gone from themes/ and
# NOT archived under prior/ — deliberately. prior/ holds a superseded version of
# a member that still ships (that is what static-v1 was to ginger-tabby); it is
# not a graveyard for a roster that no longer has members here. Nothing paid for
# was lost: every one of those twelve sheets is byte-identical to an original
# still on disk in art/roster/ and art/done-sweep/, every derived PNG recompiles
# from it with tools/art/compile.mjs, and git holds the directory entire.
#
# DEFAULT BY NAME, not by a flag. src/config.js's DEFAULT_THEME has always been
# the string `cats`, so occupying that id is the whole of "make it the default" —
# there is no second place that has to agree.
spec-version: 1
id: cats
label: Cats
rows: 4
members:
  - id: ginger
    asset-root: sprites/ginger
    label: Ginger
    slots: [0]
    persona: leans in far closer than the situation calls for, entirely delighted
      that you are here
    animation:
      kind: static
    poses:
      idle: "curled up fast asleep: body curled into a loaf, head lowered and resting
        ON the front paws, EYES CLOSED, tail wrapped around the body — but the
        ears still stand clearly above the head, never tucked under or
        flattened"
      working: scrabbling forward, both front paws low and busy, forequarters down and
        rump up, tail raised and kinked — but the head stays UP with the ears
        pricked, NEVER lowered
      needs-input: "seen from a HIGH CAMERA ANGLE, as if you are standing over the cat
        and looking down at it: it sits at your feet, close to you and filling
        the cell, and tips its face UP to meet your eyes — so the head is large
        and near, and the chest, shoulders and front paws foreshorten away below
        it. Eyes wide, open and waiting: the look a cat gives you standing
        beside its empty bowl. A whole animal seen from above, never a floating
        head"
      needs-approval: sitting squarely front-on facing the viewer with ONE FRONT PAW
        LIFTED AND REACHING OUT TOWARD YOU at chest height, the pad of the paw
        turned to the viewer, the other three paws planted — insistent, pawing
        at you for attention, eyes on yours
      error: "startled: back arched, tail raised and bristled, ears flattened back,
        eyes round and caught out, mouth closed — surprised, not shrieking"
      done: walking toward the viewer at an easy trot, body level and side-on, TAIL
        STRAIGHT UP VERTICAL like a flagpole with a small hook at the tip, ears
        up, head up and pleased — the happy tail-up greeting walk, coming to
        tell you it is finished
